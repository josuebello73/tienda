{% extends 'tienda/base_auth.html' %}
{% load static %}

{% block titulo %}Contraseña Actualizada - Mi Tienda{% endblock %}

{% block contenido %}

<div class="auth-card">
    <div class="auth-header">
        <span class="auth-icon">✅</span>
        <h2>¡Contraseña actualizada!</h2>
        <p>Tu contraseña ha sido cambiada correctamente</p>
    </div>

    <div style="text-align: center; margin-top: 2rem;">
        <a href="{% url 'login' %}" class="btn-auth" style="display: inline-block; text-decoration: none;">
            Iniciar sesión
        </a>
    </div>
</div>

{% endblock %}
