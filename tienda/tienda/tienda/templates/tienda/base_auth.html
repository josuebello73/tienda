{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Mi Tienda{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/estilo.css' %}?v=3">
</head>
<body class="auth-body">

    <!-- Logo -->
    <a href="{% url 'inicio' %}" class="auth-logo">
        👑 MI TIENDA
    </a>

    <!-- Botón volver -->
    <a href="{% url 'inicio' %}" class="auth-back">
        ← Volver a la tienda
    </a>

    <!-- Mensajes -->
    {% if messages %}
    <div class="auth-messages">
        {% for message in messages %}
            <div class="auth-alert auth-alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="auth-main">
        {% block contenido %}{% endblock %}
    </main>

</body>
</html>
